spring.application.name=task-management-service

# Schema is owned by schema.sql (non-destructive CREATE ... IF NOT EXISTS).
# Hibernate only validates the mapping and never drops or recreates tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=embedded

# The H2 web console is disabled by default and only enabled by the "local" profile.
spring.h2.console.enabled=false

# Never leak internal details through Spring's fallback /error endpoint.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
