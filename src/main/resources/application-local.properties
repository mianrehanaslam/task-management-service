# Local development profile: run with --spring.profiles.active=local
# These are throwaway credentials for a private in-memory database; do not reuse them elsewhere.
spring.datasource.url=jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
